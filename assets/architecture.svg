<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Architecture: Catalyst Data Store and NoSQL evidence collections feed the entity-fusion engine, which feeds the deterministic analytics engine and the guarded AI layer, surfaced through the Next.js portal on Catalyst Slate to SCRB, command staff and investigating officers">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2B53"/><stop offset="100%" stop-color="#0B2E59"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12386B"/><stop offset="100%" stop-color="#0D2F5A"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5C93CE"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="10" fill="url(#abg)" stroke="#1d4d85"/>

  <text x="34" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">How a record becomes a lead</text>
  <text x="34" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FB4DC">Every stage below is real code in this repository — no stage is a stub.</text>
  <rect x="34" y="74" width="230" height="3" rx="1.5" fill="#FF9933"/>

  <!-- ── STAGE 1: sources ─────────────────────────────── -->
  <g>
    <rect x="34" y="104" width="200" height="88" rx="7" fill="url(#box)" stroke="#2a5f9e"/>
    <rect x="34" y="104" width="200" height="3" rx="1.5" fill="#FF9933"/>
    <text x="50" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Catalyst Data Store</text>
    <text x="50" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">21 tables · Karnataka FIR schema</text>
    <text x="50" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">5,000 FIRs · 2022–2026</text>
    <text x="50" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6F9BCB">read via ZCQL</text>

    <rect x="34" y="216" width="200" height="88" rx="7" fill="url(#box)" stroke="#2a5f9e"/>
    <rect x="34" y="216" width="200" height="3" rx="1.5" fill="#138808"/>
    <text x="50" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">NoSQL evidence</text>
    <text x="50" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">calls · CCTV · transactions</text>
    <text x="50" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">statements · timeline events</text>
    <text x="50" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6F9BCB">6 collections · stable record IDs</text>
  </g>

  <!-- ── STAGE 2: fusion ──────────────────────────────── -->
  <g>
    <rect x="300" y="140" width="196" height="128" rx="7" fill="url(#box)" stroke="#FF9933" stroke-width="1.6"/>
    <rect x="300" y="140" width="196" height="3" rx="1.5" fill="#FF9933"/>
    <text x="316" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Entity fusion</text>
    <text x="316" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">one person, five record</text>
    <text x="316" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">shapes → one KA-P id</text>
    <text x="316" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">+ merged cross-source</text>
    <text x="316" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">chronological timeline</text>
    <text x="316" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6F9BCB">personFusion.ts</text>
  </g>

  <!-- ── STAGE 3: analytics + AI ──────────────────────── -->
  <g>
    <rect x="562" y="96" width="216" height="104" rx="7" fill="url(#box)" stroke="#2a5f9e"/>
    <rect x="562" y="96" width="216" height="3" rx="1.5" fill="#4FA3E3"/>
    <text x="578" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Analytics engine</text>
    <text x="578" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">hotspots · MO clustering</text>
    <text x="578" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">control charts · clearance</text>
    <text x="578" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">repeat offenders · scoring</text>
    <text x="578" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6F9BCB">deterministic — no LLM</text>

    <rect x="562" y="220" width="216" height="104" rx="7" fill="url(#box)" stroke="#2a5f9e"/>
    <rect x="562" y="220" width="216" height="3" rx="1.5" fill="#B36BD8"/>
    <text x="578" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">AI layer</text>
    <text x="578" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">contradictions · next question</text>
    <text x="578" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">Ask Anything · Kannada TTS</text>
    <text x="578" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">GLM-4.7-Flash · tool calling</text>
    <text x="578" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6F9BCB">every claim carries a record ID</text>
  </g>

  <!-- citation guardrail gate -->
  <g>
    <rect x="812" y="238" width="92" height="68" rx="7" fill="#1a1030" stroke="#B36BD8" stroke-width="1.6"/>
    <text x="858" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#E3C6F5">citation</text>
    <text x="858" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#E3C6F5">guardrail</text>
    <text x="858" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9B79B8">per-ID check</text>
    <rect x="812" y="238" width="92" height="68" rx="7" fill="none" stroke="#B36BD8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ── STAGE 4: portal ──────────────────────────────── -->
  <g>
    <rect x="948" y="140" width="218" height="128" rx="7" fill="url(#box)" stroke="#2a5f9e"/>
    <rect x="948" y="140" width="218" height="3" rx="1.5" fill="#138808"/>
    <text x="964" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">The portal</text>
    <text x="964" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">Next.js 15 · React 19</text>
    <text x="964" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">Catalyst Slate (SSR)</text>
    <text x="964" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#A8C8E8">WCAG 2.1 AA · Kannada audio</text>
    <text x="964" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8FD6A0">SCRB · command staff · IOs</text>
  </g>

  <!-- ── connectors ───────────────────────────────────── -->
  <g stroke="#3B6FA8" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path id="p1" d="M234 148 C266 148 268 190 298 196"/>
    <path id="p2" d="M234 260 C266 260 268 220 298 212"/>
    <path id="p3" d="M496 186 C528 186 530 148 560 148"/>
    <path id="p4" d="M496 224 C528 224 530 262 560 268"/>
    <path id="p5" d="M778 148 C860 148 880 178 946 190"/>
    <path d="M778 272 L810 272"/>
    <path id="p6" d="M904 272 C926 272 928 236 946 226"/>
  </g>

  <!-- travelling records -->
  <g fill="#FF9933">
    <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#8FD6A0"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#4FA3E3"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#C89BE6"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#8FD6A0"><animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#C89BE6"><animateMotion dur="2s" begin="2.4s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="34" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F9BCB">The number is never model-generated — the AI layer writes explanations and questions; every score, count and cluster above it is computed arithmetic over real records.</text>
  <text x="34" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6F9BCB">A finding whose cited record ID is not present in the timeline handed to the model is dropped before render — enforced in the tool schema and again after the call.</text>
</svg>
